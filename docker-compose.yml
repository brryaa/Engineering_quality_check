version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8088:8088"
    volumes:
      - eql_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/eql_platform.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  eql_data:
