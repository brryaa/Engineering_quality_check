<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName newone.daxa.ltd
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /inputtest.html http://127.0.0.1:8888/input.html
    ProxyPassReverse /inputtest.html http://127.0.0.1:8888/input.html
    ProxyPass /input.html http://127.0.0.1:8888/input.html
    ProxyPassReverse /input.html http://127.0.0.1:8888/input.html
    ProxyPass /api/input http://127.0.0.1:8888/api/input
    ProxyPassReverse /api/input http://127.0.0.1:8888/api/input
    ProxyPass / http://127.0.0.1:18080/
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog /var/log/apache2/newone-error.log
    CustomLog /var/log/apache2/newone-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/newone.daxa.ltd/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/newone.daxa.ltd/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
